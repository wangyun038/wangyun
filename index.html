<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>谁是卧底 · 联机房</title>
<style>
:root{color-scheme:light;--bg:#fff;--surface:#f5f7f6;--edge:#d7dfda;--text:#18231e;--muted:#526159;--green:#236348;--orange:#91440d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}
main{max-width:850px;margin:auto;padding:28px 24px 56px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge);padding-bottom:14px;color:var(--muted);font-size:.83rem;font-weight:650}
header b{color:var(--green);letter-spacing:.12em}
h1{font-size:clamp(2.35rem,8vw,4rem);line-height:1.1;letter-spacing:-.045em;margin:34px 0 12px}
h2{font-size:1.24rem;margin:0 0 10px}
p{margin:8px 0}.lead{color:var(--muted);margin:0 0 24px}
.card{background:var(--bg);border:1px solid var(--edge);border-radius:18px;padding:20px;margin:14px 0}
.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.seat{border:1px solid var(--edge);border-radius:12px;padding:10px 8px;text-align:center}
.seat strong,.seat small{display:block;overflow-wrap:anywhere}.seat small,.muted{color:var(--muted)}
.mine{border-color:var(--green)}.out{opacity:.65}
button,input,select,textarea{font:inherit;border-radius:9px;border:1px solid var(--edge);padding:9px 12px;color:var(--text);background:var(--bg)}
button{font-weight:650;cursor:pointer}
button:hover:enabled{border-color:var(--green)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.primary{background:var(--green);color:var(--bg);border-color:var(--green)}
label{display:grid;gap:6px;margin:10px 0;color:var(--muted);font-size:.93rem}
input,select{min-width:0;width:100%;max-width:350px;color:var(--text)}
.entry{max-width:520px}.fields{display:flex;gap:12px;flex-wrap:wrap}.fields label{flex:1 1 165px}
.role[aria-pressed="true"]{border-color:var(--green);color:var(--green)}
textarea{width:100%;resize:vertical;min-height:76px}
.speaker{border-color:var(--green);background:#eaf5ee}
.line{margin:8px 0;padding:8px 12px;background:var(--surface);border-radius:9px;overflow-wrap:anywhere}
.line strong{color:var(--green);margin-right:8px}.compact{font-size:.75rem;padding:3px 8px;margin-top:6px}
.eyebrow{color:var(--green);font-size:.82rem;letter-spacing:.08em;font-weight:700}
.room-code{font-family:monospace;letter-spacing:.1em;color:var(--green);font-size:1.4rem}
.word{font-weight:800;font-size:2.4rem;color:var(--green);margin:10px 0}
.secret{border-color:#d7b896}.secret .eyebrow,#error{color:var(--orange)}
#error{min-height:1.55em}#notice{color:var(--green)}
.history{border-top:1px solid var(--edge);margin-top:12px;padding-top:10px}
details{color:var(--muted);margin-top:20px}summary{cursor:pointer}
.help{font-size:.85rem;color:var(--muted)}
@media(max-width:560px){main{padding:16px 14px 38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}}
</style>
</head>
<body>
<main>
  <header><b>联机游戏房</b><span id="connection">4–12 位玩家 · 1 位裁判</span></header>
  <h1>谁是卧底</h1>
  <p class="lead">输入昵称入座，轮到你时打字描述，再投给你怀疑的人。</p>
  <div id="game"></div>
  <p id="error" role="alert"></p>
  <p id="notice" role="status"></p>
  <details><summary>玩法与胜负</summary><p>裁判指定一名卧底并分配词语。系统在开局时随机编号，之后每轮按序让存活玩家各发言一次。请用一句话描述自己的词，避免直接说出词语。</p><p>发言收齐后自动开放投票。每人一票，不能投自己。最高票并列时，大家再发言一轮，投票对象限于并列者。卧底出局则平民获胜，剩两人且卧底仍在则卧底获胜。</p></details>
</main>
<script><!-- CLIENT_SCRIPT --></script>
</body>
</html>
